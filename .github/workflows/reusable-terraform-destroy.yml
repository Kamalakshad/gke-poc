name: "Reusable Terraform Destroy"

on:
  workflow_call:
    inputs:
      terraform_version:
        description: "Terraform version to use"
        type: string
        default: "1.9.0"
        required: false
      working_directory:
        description: "Root directory containing Terraform files"
        type: string
        default: "."
        required: false
      var_file:
        description: "Path to .tfvars file (optional)"
        type: string
        default: "terraform.tfvars"
        required: false
      environment:
        description: "Target environment to destroy"
        type: string
        default: "poc"
        required: false
      confirmation:
        description: "Explicit confirmation string (must be 'DESTROY')"
        type: string
        required: true
    secrets:
      workload_identity_provider:
        description: "GCP Workload Identity Provider resource name"
        required: true
      service_account:
        description: "GCP Service Account to impersonate"
        required: true

jobs:
  destroy:
    name: "Terraform Destroy (${{ inputs.environment }})"
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write

    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}

    steps:
      - name: Guard Check Confirmation
        run: |
          if [ "${{ inputs.confirmation }}" != "DESTROY" ]; then
            echo "::error::Confirmation string '${{ inputs.confirmation }}' does not match 'DESTROY'. Aborting."
            exit 1
          fi

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (WIF / OIDC)
        id: gcp-auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.workload_identity_provider }}
          service_account: ${{ secrets.service_account }}
          token_format: "access_token"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ inputs.terraform_version }}
          terraform_wrapper: false

      - name: Terraform Init
        id: init
        run: terraform init

      - name: Terraform Destroy
        id: destroy
        run: |
          VAR_FLAG=""
          if [ -f "${{ inputs.var_file }}" ]; then
            VAR_FLAG="-var-file=${{ inputs.var_file }}"
          fi
          
          terraform destroy -auto-approve -input=false $VAR_FLAG

      - name: Teardown Summary
        run: |
          echo "### ⚠️ Terraform Teardown Completed (${{ inputs.environment }})" >> $GITHUB_STEP_SUMMARY
          echo "All resources managed by state in environment \`${{ inputs.environment }}\` have been destroyed." >> $GITHUB_STEP_SUMMARY
